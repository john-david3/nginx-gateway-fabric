name: test

on:
  workflow_dispatch:
    inputs:
      agent-branch:
        description: 'Agent to test'
        required: true
        type: string

jobs:
  approval:
    environment:
      name: agent-branch-testing
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved"
      
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent
        run: echo "${{ inputs.agent-branch }}"
